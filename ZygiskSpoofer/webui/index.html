<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zygisk Spoofer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #0d0d12;
  --bg-card: #15151e;
  --bg-card-hover: #1a1a26;
  --bg-input: #0a0a0f;
  --border-card: #222230;
  --border-focus: #7c3aed;
  --text-title: #9d4edd;
  --text-main: #f3f4f6;
  --text-muted: #8b8d99;
  --purple-main: #7c3aed;
  --purple-gradient: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
  --purple-btn: #6d28d9;
  --purple-btn-hover: #7c3aed;
  --purple-glow: rgba(124, 58, 237, 0.4);
  --success: #10b981;
  --danger: #ef4444;
  --radius-card: 16px;
  --radius-btn: 20px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-app);
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: 95px;
}

/* App Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.25rem 1.25rem 0.75rem 1.25rem;
  position: sticky;
  top: 0;
  background: rgba(13, 13, 18, 0.95);
  backdrop-filter: blur(12px);
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.app-title {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #ffffff;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.25rem;
  transition: all 0.2s;
}

.icon-btn:hover {
  background: var(--bg-card);
  color: var(--text-main);
}

/* Container */
.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Spoofer Cards */
.spoofer-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  position: relative;
  transition: all 0.25s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.spoofer-card:hover {
  border-color: rgba(124, 58, 237, 0.4);
  background: var(--bg-card-hover);
}

.spoofer-card.flash {
  border-color: #8b5cf6;
  box-shadow: 0 0 16px rgba(139, 92, 246, 0.5);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-label {
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-title);
}

/* Custom Checkbox */
.custom-checkbox {
  position: relative;
  width: 22px;
  height: 22px;
  cursor: pointer;
}

.custom-checkbox input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}

.checkmark {
  position: absolute;
  top: 0;
  left: 0;
  height: 22px;
  width: 22px;
  background-color: #242434;
  border: 1.5px solid #3c3c52;
  border-radius: 6px;
  transition: all 0.2s ease;
}

.custom-checkbox input:checked ~ .checkmark {
  background-color: #8b5cf6;
  border-color: #8b5cf6;
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
}

.checkmark:after {
  content: "";
  position: absolute;
  display: none;
}

.custom-checkbox input:checked ~ .checkmark:after {
  display: block;
  left: 7px;
  top: 3px;
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}

/* Value Field */
.value-container {
  display: flex;
  align-items: flex-start;
}

.value-input {
  width: 100%;
  background: transparent;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.92rem;
  color: var(--text-main);
  word-break: break-all;
  white-space: normal;
  outline: none;
  resize: none;
  line-height: 1.5;
}

.value-input:focus {
  color: #a78bfa;
}

/* Card Bottom */
.card-bottom {
  display: flex;
  justify-content: flex-end;
  margin-top: 0.25rem;
}

.btn-random {
  background: var(--purple-gradient);
  color: #ffffff;
  border: none;
  padding: 0.45rem 1.35rem;
  border-radius: var(--radius-btn);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 0 4px 12px var(--purple-glow);
  transition: all 0.2s ease;
}

.btn-random:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(124, 58, 237, 0.6);
}

.btn-random:active {
  transform: scale(0.96);
}

/* Target Apps Section */
.collapsible-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 1.25rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.collapsible-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.collapsible-title {
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #60a5fa;
}

.target-list {
  margin-top: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.target-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0f0f17;
  padding: 0.6rem 0.85rem;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.05);
}

.target-item span {
  word-break: break-all;
}

.btn-del {
  background: transparent;
  border: none;
  color: #ef4444;
  cursor: pointer;
  padding: 0 0.4rem;
  font-size: 1rem;
  font-weight: bold;
}

.btn-del:hover {
  color: #f87171;
}

.add-target-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.85rem;
}

.add-target-input {
  flex: 1;
  background: #0a0a0f;
  border: 1px solid var(--border-card);
  border-radius: 8px;
  padding: 0.55rem 0.75rem;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  outline: none;
}

.add-target-input:focus {
  border-color: #60a5fa;
}

.btn-add {
  background: #2563eb;
  color: white;
  border: none;
  padding: 0.55rem 1.1rem;
  border-radius: 8px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-add:hover {
  background: #3b82f6;
}

/* Floating Bottom Toolbar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(13, 13, 18, 0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 0.85rem 1.25rem;
  display: flex;
  justify-content: center;
  z-index: 200;
}

.bar-content {
  max-width: 520px;
  width: 100%;
  display: flex;
  gap: 0.75rem;
}

.btn-action-main {
  flex: 1;
  padding: 0.75rem 1rem;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border: none;
  transition: all 0.2s;
}

.btn-random-all {
  background: #272738;
  color: #e2e8f0;
  border: 1px solid #3c3c52;
}

.btn-random-all:hover {
  background: #33334a;
}

.btn-save-apply {
  background: var(--purple-gradient);
  color: #ffffff;
  box-shadow: 0 4px 16px var(--purple-glow);
}

.btn-save-apply:hover {
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.7);
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e1e2d;
  color: #f1f5f9;
  border: 1px solid #7c3aed;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  padding: 0.65rem 1.25rem;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 300;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">Zygisk Spoofer</div>
  <div class="header-actions">
    <button class="icon-btn" onclick="randomizeAll()" title="Randomize All">🎲</button>
  </div>
</header>

<div class="container">

  <!-- 1. ANDROID ID -->
  <div class="spoofer-card" id="card-android-id">
    <div class="card-top">
      <span class="card-label">ANDROID ID</span>
      <label class="custom-checkbox">
        <input type="checkbox" id="chk-android-id" checked onchange="syncConfigFromUI()">
        <span class="checkmark"></span>
      </label>
    </div>
    <div class="value-container">
      <textarea id="val-android-id" class="value-input" rows="1" spellcheck="false" oninput="syncConfigFromUI()">f5ff848873c1a17d</textarea>
    </div>
    <div class="card-bottom">
      <button class="btn-random" onclick="randomizeField('android-id')">Random</button>
    </div>
  </div>

  <!-- 2. GSF ID -->
  <div class="spoofer-card" id="card-gsf-id">
    <div class="card-top">
      <span class="card-label">GSF ID</span>
      <label class="custom-checkbox">
        <input type="checkbox" id="chk-gsf-id" checked onchange="syncConfigFromUI()">
        <span class="checkmark"></span>
      </label>
    </div>
    <div class="value-container">
      <textarea id="val-gsf-id" class="value-input" rows="1" spellcheck="false" oninput="syncConfigFromUI()">67db684e29db56a0</textarea>
    </div>
    <div class="card-bottom">
      <button class="btn-random" onclick="randomizeField('gsf-id')">Random</button>
    </div>
  </div>

  <!-- 3. ADS ID -->
  <div class="spoofer-card" id="card-ads-id">
    <div class="card-top">
      <span class="card-label">ADS ID</span>
      <label class="custom-checkbox">
        <input type="checkbox" id="chk-ads-id" checked onchange="syncConfigFromUI()">
        <span class="checkmark"></span>
      </label>
    </div>
    <div class="value-container">
      <textarea id="val-ads-id" class="value-input" rows="2" spellcheck="false" oninput="syncConfigFromUI()">c0725525-4660-4cd0-b3ea-c712e7adb543</textarea>
    </div>
    <div class="card-bottom">
      <button class="btn-random" onclick="randomizeField('ads-id')">Random</button>
    </div>
  </div>

  <!-- 4. APP SET ID -->
  <div class="spoofer-card" id="card-app-set-id">
    <div class="card-top">
      <span class="card-label">APP SET ID</span>
      <label class="custom-checkbox">
        <input type="checkbox" id="chk-app-set-id" checked onchange="syncConfigFromUI()">
        <span class="checkmark"></span>
      </label>
    </div>
    <div class="value-container">
      <textarea id="val-app-set-id" class="value-input" rows="2" spellcheck="false" oninput="syncConfigFromUI()">68939b1b-0bb8-47f7-880b-a95d60ef77d0</textarea>
    </div>
    <div class="card-bottom">
      <button class="btn-random" onclick="randomizeField('app-set-id')">Random</button>
    </div>
  </div>

  <!-- 5. MEDIA DRM ID -->
  <div class="spoofer-card" id="card-media-drm-id">
    <div class="card-top">
      <span class="card-label">MEDIA DRM ID</span>
      <label class="custom-checkbox">
        <input type="checkbox" id="chk-media-drm-id" checked onchange="syncConfigFromUI()">
        <span class="checkmark"></span>
      </label>
    </div>
    <div class="value-container">
      <textarea id="val-media-drm-id" class="value-input" rows="3" spellcheck="false" oninput="syncConfigFromUI()">c32f4a943fe9840c2e6f554dcd6d6987bff8a56ca6e406d00435578214c5547c</textarea>
    </div>
    <div class="card-bottom">
      <button class="btn-random" onclick="randomizeField('media-drm-id')">Random</button>
    </div>
  </div>

  <!-- Target Apps Manager -->
  <div class="collapsible-card">
    <div class="collapsible-header" onclick="toggleTargetList()">
      <span class="collapsible-title">🎯 Target Applications</span>
      <span id="target-toggle-icon" style="color: var(--text-muted);">▼</span>
    </div>
    <div id="target-body" style="display: block;">
      <div class="target-list" id="target-list-container">
        <!-- Rendered dynamically -->
      </div>
      <div class="add-target-row">
        <input type="text" id="new-target-input" class="add-target-input" placeholder="e.g. travel.eskimo.esim" onkeydown="if(event.key==='Enter') addTargetApp()">
        <button class="btn-add" onclick="addTargetApp()">+ Add</button>
      </div>
    </div>
  </div>

</div>

<!-- Floating Action Bar -->
<div class="bottom-bar">
  <div class="bar-content">
    <button class="btn-action-main btn-random-all" onclick="randomizeAll()">
      <span>🎲</span> Randomize All
    </button>
    <button class="btn-action-main btn-save-apply" onclick="saveConfiguration()">
      <span>💾</span> Save & Apply
    </button>
  </div>
</div>

<div class="toast" id="toast">Saved successfully!</div>

<script>
const CONFIG_PATH = "/data/adb/modules/zygisksspoofer/config.json";

let currentConfig = {
  enabled: true,
  targets: [
    "travel.eskimo.esim",
    "com.wonet.usims",
    "com.airalo.android",
    "com.trustroam",
    "com.nomad.app",
    "com.holafly.android",
    "com.samsung.android.euicc"
  ],
  android_id: { enabled: true, value: "f5ff848873c1a17d" },
  gsf_id: { enabled: true, value: "67db684e29db56a0" },
  ads_id: { enabled: true, value: "c0725525-4660-4cd0-b3ea-c712e7adb543" },
  app_set_id: { enabled: true, value: "68939b1b-0bb8-47f7-880b-a95d60ef77d0" },
  media_drm_id: { enabled: true, value: "c32f4a943fe9840c2e6f554dcd6d6987bff8a56ca6e406d00435578214c5547c" }
};

// Hex & UUID Generators
function randHex(len) {
  const chars = "0123456789abcdef";
  let res = "";
  for (let i = 0; i < len; i++) {
    res += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return res;
}

function randUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function flashCard(cardId) {
  const card = document.getElementById(cardId);
  if (card) {
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 350);
  }
}

function randomizeField(key) {
  if (key === 'android-id') {
    const val = randHex(16);
    document.getElementById('val-android-id').value = val;
    currentConfig.android_id.value = val;
    flashCard('card-android-id');
    showToast("Randomized ANDROID ID");
  } else if (key === 'gsf-id') {
    const val = randHex(16);
    document.getElementById('val-gsf-id').value = val;
    currentConfig.gsf_id.value = val;
    flashCard('card-gsf-id');
    showToast("Randomized GSF ID");
  } else if (key === 'ads-id') {
    const val = randUUID();
    document.getElementById('val-ads-id').value = val;
    currentConfig.ads_id.value = val;
    flashCard('card-ads-id');
    showToast("Randomized ADS ID");
  } else if (key === 'app-set-id') {
    const val = randUUID();
    document.getElementById('val-app-set-id').value = val;
    currentConfig.app_set_id.value = val;
    flashCard('card-app-set-id');
    showToast("Randomized APP SET ID");
  } else if (key === 'media-drm-id') {
    const val = randHex(64);
    document.getElementById('val-media-drm-id').value = val;
    currentConfig.media_drm_id.value = val;
    flashCard('card-media-drm-id');
    showToast("Randomized MEDIA DRM ID");
  }
}

function randomizeAll() {
  if (document.getElementById('chk-android-id').checked) {
    const val = randHex(16);
    document.getElementById('val-android-id').value = val;
    currentConfig.android_id.value = val;
    flashCard('card-android-id');
  }
  if (document.getElementById('chk-gsf-id').checked) {
    const val = randHex(16);
    document.getElementById('val-gsf-id').value = val;
    currentConfig.gsf_id.value = val;
    flashCard('card-gsf-id');
  }
  if (document.getElementById('chk-ads-id').checked) {
    const val = randUUID();
    document.getElementById('val-ads-id').value = val;
    currentConfig.ads_id.value = val;
    flashCard('card-ads-id');
  }
  if (document.getElementById('chk-app-set-id').checked) {
    const val = randUUID();
    document.getElementById('val-app-set-id').value = val;
    currentConfig.app_set_id.value = val;
    flashCard('card-app-set-id');
  }
  if (document.getElementById('chk-media-drm-id').checked) {
    const val = randHex(64);
    document.getElementById('val-media-drm-id').value = val;
    currentConfig.media_drm_id.value = val;
    flashCard('card-media-drm-id');
  }
  showToast("🎲 All active identifiers randomized!");
}

// UI Sync
function syncUIFromConfig() {
  if (currentConfig.android_id) {
    document.getElementById('chk-android-id').checked = currentConfig.android_id.enabled !== false;
    document.getElementById('val-android-id').value = currentConfig.android_id.value || "f5ff848873c1a17d";
  }
  if (currentConfig.gsf_id) {
    document.getElementById('chk-gsf-id').checked = currentConfig.gsf_id.enabled !== false;
    document.getElementById('val-gsf-id').value = currentConfig.gsf_id.value || "67db684e29db56a0";
  }
  if (currentConfig.ads_id) {
    document.getElementById('chk-ads-id').checked = currentConfig.ads_id.enabled !== false;
    document.getElementById('val-ads-id').value = currentConfig.ads_id.value || "c0725525-4660-4cd0-b3ea-c712e7adb543";
  }
  if (currentConfig.app_set_id) {
    document.getElementById('chk-app-set-id').checked = currentConfig.app_set_id.enabled !== false;
    document.getElementById('val-app-set-id').value = currentConfig.app_set_id.value || "68939b1b-0bb8-47f7-880b-a95d60ef77d0";
  }
  if (currentConfig.media_drm_id) {
    document.getElementById('chk-media-drm-id').checked = currentConfig.media_drm_id.enabled !== false;
    document.getElementById('val-media-drm-id').value = currentConfig.media_drm_id.value || "c32f4a943fe9840c2e6f554dcd6d6987bff8a56ca6e406d00435578214c5547c";
  }

  renderTargetList();
}

function syncConfigFromUI() {
  currentConfig.android_id = {
    enabled: document.getElementById('chk-android-id').checked,
    value: document.getElementById('val-android-id').value.trim()
  };
  currentConfig.gsf_id = {
    enabled: document.getElementById('chk-gsf-id').checked,
    value: document.getElementById('val-gsf-id').value.trim()
  };
  currentConfig.ads_id = {
    enabled: document.getElementById('chk-ads-id').checked,
    value: document.getElementById('val-ads-id').value.trim()
  };
  currentConfig.app_set_id = {
    enabled: document.getElementById('chk-app-set-id').checked,
    value: document.getElementById('val-app-set-id').value.trim()
  };
  currentConfig.media_drm_id = {
    enabled: document.getElementById('chk-media-drm-id').checked,
    value: document.getElementById('val-media-drm-id').value.trim()
  };
}

// Target Apps Manager
function renderTargetList() {
  const container = document.getElementById('target-list-container');
  container.innerHTML = '';
  if (!currentConfig.targets || !Array.isArray(currentConfig.targets)) {
    currentConfig.targets = [];
  }
  currentConfig.targets.forEach((pkg, index) => {
    const item = document.createElement('div');
    item.className = 'target-item';
    item.innerHTML = `
      <span>${pkg}</span>
      <button class="btn-del" onclick="removeTargetApp(${index})" title="Remove">✕</button>
    `;
    container.appendChild(item);
  });
}

function addTargetApp() {
  const input = document.getElementById('new-target-input');
  const val = input.value.trim();
  if (val) {
    if (!currentConfig.targets.includes(val)) {
      currentConfig.targets.push(val);
      renderTargetList();
      input.value = '';
      showToast(`Added ${val}`);
      saveConfiguration(); // Auto-save on adding
    } else {
      showToast(`Already exists: ${val}`);
    }
  }
}

function removeTargetApp(index) {
  const removed = currentConfig.targets.splice(index, 1);
  renderTargetList();
  showToast(`Removed ${removed}`);
  saveConfiguration(); // Auto-save on removing
}

function toggleTargetList() {
  const body = document.getElementById('target-body');
  const icon = document.getElementById('target-toggle-icon');
  if (body.style.display === 'none') {
    body.style.display = 'block';
    icon.textContent = '▲';
  } else {
    body.style.display = 'none';
    icon.textContent = '▼';
  }
}

// =====================================================================
// Universal Root Bridge (KernelSU, APatch, MMRL, Magisk)
// =====================================================================

async function rootExec(cmd) {
  // 1. KernelSU / APatch
  if (window.ksu && typeof window.ksu.exec === 'function') {
    try {
      let res;
      if (window.ksu.exec.constructor.name === 'AsyncFunction' || window.ksu.exec.length === 1) {
        res = await window.ksu.exec(cmd);
      } else {
        res = window.ksu.exec(cmd);
        if (res instanceof Promise) res = await res;
      }

      if (typeof res === 'string') {
        try {
          const parsed = JSON.parse(res);
          if (parsed && typeof parsed.stdout !== 'undefined') return parsed.stdout;
        } catch (e) {}
        return res;
      } else if (res && typeof res.stdout !== 'undefined') {
        return res.stdout;
      }
      return String(res || '');
    } catch (err) {
      console.warn("ksu.exec error:", err);
    }
  }

  // 2. MMRL
  if (window.mmrl && typeof window.mmrl.exec === 'function') {
    try {
      const res = await window.mmrl.exec(cmd);
      return typeof res === 'string' ? res : (res && res.stdout ? res.stdout : '');
    } catch (e) {}
  }

  // 3. Magisk WebUI
  if (window.exec && typeof window.exec === 'function') {
    return new Promise((resolve) => {
      window.exec(cmd, (stdout, stderr) => {
        resolve(stdout || '');
      });
    });
  }

  return null;
}

async function loadConfiguration() {
  try {
    const raw = await rootExec(`cat "${CONFIG_PATH}"`);
    if (raw && raw.includes('"android_id"')) {
      currentConfig = JSON.parse(raw);
      console.log("Loaded config from module:", currentConfig);
    } else {
      const cached = localStorage.getItem('zygisksspoofer_config');
      if (cached) currentConfig = JSON.parse(cached);
    }
  } catch (e) {
    console.warn("Using default configuration:", e);
  }
  syncUIFromConfig();
}

async function saveConfiguration() {
  syncConfigFromUI();
  const jsonStr = JSON.stringify(currentConfig, null, 2);
  localStorage.setItem('zygisksspoofer_config', jsonStr);

  // Base64 encode the JSON to avoid ANY shell escaping issues
  const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
  const writeCmd = `sh -c "echo '${b64}' | base64 -d > ${CONFIG_PATH} && chmod 644 ${CONFIG_PATH}"`;

  try {
    await rootExec(writeCmd);
    
    // Verify by reading back
    const verify = await rootExec(`cat "${CONFIG_PATH}"`);
    if (verify && verify.includes('"android_id"')) {
      showToast("💾 Saved to module successfully!");
      if (window.ksu && typeof window.ksu.toast === 'function') {
        window.ksu.toast("Zygisk Spoofer: Saved & Applied!");
      }
    } else {
      showToast("💾 Saved locally!");
    }
  } catch (e) {
    showToast("💾 Saved to storage");
  }
}

let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// Initialize on page load
window.addEventListener('DOMContentLoaded', () => {
  loadConfiguration();
});
